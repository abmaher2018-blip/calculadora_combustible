workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Generate Flutter project structure
        script: |
          cp lib/main.dart /tmp/main.dart 2>/dev/null || true
          rm -rf *
          rm -rf .git
          flutter create --template=app --project-name=calculadora_combustible --org=com.viaje.combustible .
          cp /tmp/main.dart lib/main.dart 2>/dev/null || true
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
